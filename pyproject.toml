[project]
name = "deliberation-engine"
version = "0.1.0"
description = "Two-agent (Proposer/Critic) deliberation that turns vague feature requests into decision documents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "openai>=1.99",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.scripts]
deliberate = "deliberation.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deliberation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
